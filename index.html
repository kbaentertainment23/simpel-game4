    <script>
      // 0. Resilient Global JSON Safety Shield
      (function () {
        if (typeof window !== 'undefined' && window.JSON) {
          var origParse = window.JSON.parse;
          window.JSON.parse = function (text, reviver) {
            if (text === null || text === undefined || text === '' || text === 'null' || text === 'undefined' || text === 'NaN') {
              return null;
            }
            if (typeof text === 'string') {
              var trimmed = text.trim();
              if (trimmed === '' || trimmed === 'null' || trimmed === 'undefined' || trimmed === 'NaN' || trimmed === '{"null"}' || trimmed === '{null}') {
                return null;
              }
            }
            try {
              return origParse.apply(this, arguments);
            } catch (err) {
              console.warn('[SafeJSON] Suppressed invalid JSON parse attempt:', (err && err.message) || err, 'Snippet:', String(text).slice(0, 60));
              return null;
            }
          };
        }

        // Safe Response.json handling
        if (typeof window !== 'undefined' && window.Response && window.Response.prototype && window.Response.prototype.json) {
          var origRespJson = window.Response.prototype.json;
          window.Response.prototype.json = function () {
            var self = this;
            return origRespJson.apply(self, arguments).catch(function (err) {
              console.warn('[SafeResponseJSON] Suppressed response.json failure:', (err && err.message) || err);
              return null;
            });
          };
        }
      })();

      // Prevent Vite dev server HMR WebSocket connection failure notices in sandboxed preview
      (function () {
        // 1. Intercept WebSocket instantiation for Vite HMR
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function (url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('hmr') !== -1;

            if (isViteHmr) {
              // Return a silent no-op mock WebSocket that stays quietly in OPEN state
              var dummyTarget = new EventTarget();
              var dummyWs = {
                url: urlStr,
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                binaryType: 'blob',
                send: function () {},
                close: function () {},
                addEventListener: function (type, listener, options) {
                  dummyTarget.addEventListener(type, listener, options);
                },
                removeEventListener: function (type, listener, options) {
                  dummyTarget.removeEventListener(type, listener, options);
                },
                dispatchEvent: function (event) {
                  return dummyTarget.dispatchEvent(event);
                },
              };

              // Notify open on next tick so Vite dev client considers connection successful
              setTimeout(function () {
                if (typeof dummyWs.onopen === 'function') {
                  try {
                    dummyWs.onopen(new Event('open'));
                  } catch (e) {}
                }
                dummyTarget.dispatchEvent(new Event('open'));
              }, 20);

              return dummyWs;
            }

            return new OrigWebSocket(url, protocols);
          };

          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        // 2. Secondary layer: suppress any Vite websocket console logs or window error events
        var origConsoleError = console.error;
        console.error = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || String(arg))) || '';
            if (
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('[vite] failed to connect') !== -1
            ) {
              return; // Silently ignore Vite HMR dev websocket disconnect
            }
          }
          return origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function () {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = (arg && (arg.message || arg.stack || String(arg))) || '';
            if (
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf('WebSocket closed without opened') !== -1 ||
              str.indexOf('[vite] failed to connect') !== -1
            ) {
              return;
            }
          }
          return origConsoleWarn.apply(console, arguments);
        };

        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || String(event || '');
          if (
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite] failed to connect') !== -1 ||
            msg.indexOf('is not valid JSON') !== -1 ||
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('JSON.parse') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || String(reason || '');
          if (
            msg.indexOf('failed to connect to websocket') !== -1 ||
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            msg.indexOf('[vite] failed to connect') !== -1 ||
            msg.indexOf('is not valid JSON') !== -1 ||
            msg.indexOf('Unexpected token') !== -1 ||
            msg.indexOf('JSON.parse') !== -1
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
